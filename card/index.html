<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SECARD 세션카드 메이커</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Cinzel:wght@700&family=Cute+Font&family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@400;700;900&family=Jua&family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@700;800&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700;900&family=Share+Tech+Mono&family=Single+Day&family=Song+Myung&family=Yeon+Sung&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background: #050505; color: #fff; touch-action: manipulation; padding-bottom: 80px; }
    ::-webkit-scrollbar { display: none; }
    button { font-family: inherit; }

    header { padding: 14px 16px; border-bottom: 1px solid #27272a; position: sticky; top: 0; background: rgba(5,5,5,.92); backdrop-filter: blur(8px); z-index: 60; height: 49px; }
    header b { font-weight: 900; letter-spacing: .15em; font-size: 17px; }
    header small { font-size: 10px; color: #71717a; font-family: 'Share Tech Mono', monospace; margin-left: 6px; }

    /* 미리보기는 위에 고정 → 아래에서 설정 바꾸면서 바로 확인 */
    .stage { position: sticky; top: 49px; z-index: 50; background: #050505; padding: 8px 12px 10px; max-width: 640px; margin: 0 auto; }
    .stage-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 6px; }
    .stage-top b { font-size: 13px; color: #d4d4d8; }
    .stage-top span { font-size: 10px; color: #71717a; font-family: 'Share Tech Mono', monospace; }
    .canvas-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #27272a; box-shadow: 0 0 20px rgba(0,0,0,.5); }
    #previewCanvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

    main { max-width: 640px; margin: 0 auto; padding: 4px 12px; display: grid; gap: 12px; }
    .panel { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 14px; }
    .panel h2 { margin: 0 0 4px; font-size: 14px; color: #d4d4d8; }
    .sub { margin: 0 0 8px; font-size: 11px; color: #71717a; line-height: 1.5; }

    .tag-category { font-size: 11px; color: #71717a; margin: 12px 0 6px; font-weight: bold; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-btn, .wbtn { padding: 6px 12px; border-radius: 6px; border: 1px solid #27272a; background: #111; color: #a1a1aa; font-size: 12px; cursor: pointer; white-space: nowrap; transition: .15s; }
    .tag-btn.active, .wbtn.active { background: #fff; color: #000; border-color: #fff; font-weight: bold; }
    .wbtn { padding: 8px 12px; }
    .wbtn.add { border-style: dashed; }

    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: #0b0b0d; padding: 4px; border-radius: 10px; margin-bottom: 12px; }
    .tab { padding: 9px 0; border: 0; border-radius: 7px; background: transparent; color: #a1a1aa; font-size: 13px; font-weight: bold; cursor: pointer; }
    .tab.active { background: #fff; color: #000; }
    .pane.hidden { display: none; }
    .tpl { display: block; width: 100%; text-align: left; background: #111; border: 1px solid #27272a; color: #fff; border-radius: 10px; padding: 10px 12px; margin-top: 6px; cursor: pointer; font-family: inherit; }
    .tpl b { font-size: 13px; } .tpl small { display: block; color: #71717a; font-size: 11px; margin-top: 2px; }
    .tpl.active { border-color: #fff; background: #1c1c20; }

    .blank { border: 1px dashed #3f3f46; border-radius: 10px; padding: 16px; text-align: center; font-size: 12px; color: #71717a; line-height: 1.6; }
    details { margin-top: 12px; }
    summary { font-size: 12px; color: #a1a1aa; cursor: pointer; padding: 6px 0; }

    .card { background: #111; border: 1px solid #27272a; border-radius: 10px; padding: 12px; margin-top: 10px; }
    .card.sel { border-color: #fff; }
    .card h3 { margin: 0 0 8px; font-size: 12px; color: #e4e4e7; }
    .fld { display: block; margin-top: 8px; }
    .fl { display: flex; justify-content: space-between; font-size: 11px; color: #a1a1aa; font-weight: bold; }
    .rv { color: #fff; font-family: 'Share Tech Mono', monospace; }
    .input-box { width: 100%; background: #09090b; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; font-size: 13px; outline: none; margin-top: 4px; font-family: inherit; }
    .input-box:focus { border-color: #fff; }
    textarea.input-box { resize: vertical; }
    input[type=range] { width: 100%; margin-top: 6px; accent-color: #fff; }
    input[type=color] { width: 100%; height: 40px; border: 1px solid #333; border-radius: 8px; background: #09090b; padding: 2px; margin-top: 4px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { background: #27272a; color: #fff; border: 1px solid #3f3f46; border-radius: 8px; padding: 11px; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn:hover { background: #3f3f46; }
    .btn.go { background: linear-gradient(90deg, #10b981, #14b8a6); border: 0; padding: 15px 0; border-radius: 12px; }
    .btn:active { transform: scale(.97); }
    #loadingBar { height: 8px; background: #27272a; border-radius: 99px; overflow: hidden; margin-top: 10px; }
    #loadingBar.hidden, #resultArea.hidden { display: none; }
    #progressFill { height: 100%; width: 0; background: #10b981; transition: width .2s; }
    #resultArea { text-align: center; font-size: 12px; color: #34d399; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

<header><b>SECARD</b><small>SESSION CARD MAKER</small></header>

<div class="stage">
  <div class="stage-top"><b>PREVIEW</b><span id="statusMsg">위젯이나 빈 곳(템플릿)을 눌러 선택하세요</span></div>
  <div class="canvas-wrapper"><canvas id="previewCanvas" width="960" height="540"></canvas></div>
</div>

<main>
  <!-- ② 탭 -->
  <section class="panel">
    <h2>① 위젯 고르기 · 꾸미기</h2>
    <div class="tabs">
      <button class="tab active" data-tab="tabTemplate">템플릿</button>
      <button class="tab" data-tab="tabWidget">위젯</button>
      <button class="tab" data-tab="tabDetail">상세 설정</button>
      <button class="tab" data-tab="tabColor">색상</button>
    </div>

    <!-- 위젯 탭 -->
    <div id="tabTemplate" class="pane">
      <p class="sub">누르면 배경틀·색·위젯 배치가 통째로 세팅돼요. 고른 뒤에 [위젯]·[상세 설정]·[색상]에서 마음대로 바꾸세요. (배경 일러스트는 [상세 설정]에서 올려요)</p>
      <div id="templateList"></div>
      <div class="grid2" style="margin-top:12px">
        <button class="btn" id="btnTlReset">템플릿 위치 처음으로</button>
        <button class="btn" id="btnNoBackdrop">템플릿 배경틀만 끄기</button>
      </div>
    </div>

    <div id="tabWidget" class="pane hidden">
      <input type="text" id="wSearch" class="input-box" placeholder="🔍 이름으로 찾기 (예: 채팅, 바코드, 주사위)" style="margin:0 0 8px">
      <p class="sub">버튼을 누르면 캔버스에 나타나고, 한 번 더 누르면 사라져요. (흰색 = 켜짐)</p>
      <div id="widgetList"></div>
      <div class="grid2" style="margin-top:14px">
        <button class="btn" id="btnAllOff">모두 끄기</button>
        <button class="btn" id="btnReset">🔄 위치 처음으로</button>
      </div>
    </div>

    <!-- 상세 설정 탭 -->
    <div id="tabDetail" class="pane hidden">
      <div class="card" style="margin-top:0">
        <h3>🧩 기본 정보</h3>
        <div class="grid2">
          <label class="fld"><span class="fl">시나리오 제목</span><input type="text" id="valTitle" class="input-box"></label>
          <label class="fld"><span class="fl">제목 폰트</span>
            <select id="valTitleFont" class="input-box">
              <option value="auto">자동 (태그 분위기)</option>
              <option value="Single Day">싱글 데이 (귀여운 다꾸)</option>
              <option value="Black Han Sans">블랙 한 산스 (두꺼운 제목)</option>
              <option value="Noto Sans KR">노토 산스 (깔끔 고딕)</option>
              <option value="Do Hyeon">도현 (레트로)</option>
              <option value="Jua">주아 (동글 고딕)</option>
              <option value="Nanum Myeongjo">나눔 명조</option>
              <option value="Gowun Batang">고운 바탕 (감성)</option>
              <option value="Hahmlet">함초롬 (세련된 고전)</option>
              <option value="Song Myung">송명 (공포/스릴러)</option>
              <option value="Yeon Sung">연성 (무협/동양풍)</option>
              <option value="Nanum Pen Script">나눔 펜 (펜글씨)</option>
              <option value="Nanum Brush Script">나눔 붓 (붓글씨)</option>
              <option value="Cute Font">큐트 폰트</option>
              <option value="Share Tech Mono">Share Tech (사이버)</option>
              <option value="Cinzel">Cinzel (로판 영문)</option>
            </select>
          </label>
        </div>
        <div class="grid2">
          <label class="fld"><span class="fl">캐릭터 A</span><input type="text" id="valNameA" class="input-box"></label>
          <label class="fld"><span class="fl">캐릭터 B</span><input type="text" id="valNameB" class="input-box"></label>
        </div>
        <label class="fld"><span class="fl">대사 / 캐치프레이즈</span><input type="text" id="valQuote" class="input-box"></label>
        <div class="grid2" style="margin-top:10px">
          <label class="btn">🖼️ 배경 이미지/GIF<input type="file" id="bgInput" accept="image/*" hidden></label>
          <button class="btn" id="btnClearBg">배경 지우기</button>
        </div>
      </div>
      <div id="widgetCards"></div>
    </div>

    <!-- 색상 탭 -->
    <div id="tabColor" class="pane hidden">
      <div class="fl" style="margin-bottom:6px">분위기 (배경·색을 한 번에 바꿔요)</div>
      <div id="themeChips" class="chips" style="margin-bottom:12px"></div>
      <div class="grid2">
        <label class="fld"><span class="fl">포인트 색 1</span><input type="color" id="colAccent"></label>
        <label class="fld"><span class="fl">포인트 색 2</span><input type="color" id="colAccent2"></label>
        <label class="fld"><span class="fl">포인트 색 3</span><input type="color" id="colAccent3"></label>
        <label class="fld"><span class="fl">글자 색</span><input type="color" id="colText"></label>
        <label class="fld"><span class="fl">배경 색</span><input type="color" id="colBg"></label>
        <label class="fld"><span class="fl">배경 사진 어둡게 <span class="rv" id="dimVal">0%</span></span><input type="range" id="valDim" min="0" max="85" value="0"></label>
      </div>
      <div style="margin-top:14px"><button class="btn" id="btnResetColor" style="width:100%">🎨 색상 처음으로 (태그 기본색)</button></div>
    </div>
  </section>

  <!-- ③ 저장 -->
  <section class="panel">
    <h2>② 저장하기</h2>
    <div class="grid2" style="margin-top:8px">
      <button id="btnExportMP4" class="btn go">✨ 영상 저장</button>
      <button id="btnExportGIF" class="btn">🎬 움짤 GIF 저장</button>
    </div>
    <button id="btnExportPNG" class="btn" style="width:100%; margin-top:8px">🖼️ 지금 화면 PNG 저장</button>
    <input type="file" id="quickPick" accept="image/*" hidden>
    <div id="loadingBar" class="hidden"><div id="progressFill"></div></div>
    <div id="resultArea" class="hidden">저장 완료!</div>
  </section>
</main>

<script>
// =====================================================
// 0. 기본 설정
// =====================================================
const W_ = 960, H_ = 540;
const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');
const UI   = '"Noto Sans KR", sans-serif';
const MONO = '"Share Tech Mono", "Noto Sans KR", monospace';
const F = n => `"${n}", "Noto Sans KR", sans-serif`;
const pad2 = n => String(n).padStart(2, '0');

function rgba(hex, a) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function luminance(hex) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function wrap(c, text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const ch of para) {
      if (c.measureText(line + ch).width > maxW && line) { out.push(line); line = ch.trim() === '' ? '' : ch; }
      else line += ch;
    }
    out.push(line);
  }
  return out;
}
function fitText(c, text, weight, size, family, maxW) {
  let s = size;
  for (; s > 8; s--) { c.font = `${weight} ${s}px ${family}`; if (c.measureText(text).width <= maxW) break; }
  return s;
}
// 사진 그리기 도우미: 칸을 꽉 채우도록 가운데 기준으로 잘라서 그려요
function drawCover(c, img, x, y, w, h, r = 0) {
  c.save(); c.beginPath(); if (r > 0) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); c.clip();
  const sc = Math.max(w / img.width, h / img.height), dw = img.width * sc, dh = img.height * sc;
  c.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh); c.restore();
}
function drawCircleImg(c, img, cx, cy, r) {
  c.save(); c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.clip();
  const sc = Math.max(2 * r / img.width, 2 * r / img.height), dw = img.width * sc, dh = img.height * sc;
  c.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh); c.restore();
}
function tri(c, x, y, s, dir) { // 작은 삼각형 (재생 버튼용)
  c.beginPath(); c.moveTo(x, y - s); c.lineTo(x + dir * s * 1.4, y); c.lineTo(x, y + s); c.closePath(); c.fill();
}

// =====================================================
// 1. 테마(분위기) 정의 — 태그에 따라 자동 선택
// =====================================================
const THEMES = {
  default: { bg:'#0d0d12', accent:'#ffffff', accent2:'#a1a1aa', accent3:'#52525b', text:'#ffffff', grid:'rgba(255,255,255,.05)', step:40, font:F('Noto Sans KR'), titleFont:'Noto Sans KR' },
  cyber:   { bg:'#050b17', accent:'#00e5ff', accent2:'#ff1744', accent3:'#2a4bff', text:'#ffffff', grid:'rgba(0,229,255,.08)', step:40, scan:true, glow:'rgba(0,120,255,.25)', font:F('Share Tech Mono'), titleFont:'Share Tech Mono' },
  cam:     { bg:'#15110e', accent:'#ff9f1c', accent2:'#ffffff', accent3:'#ffd166', text:'#ffffff', grid:null, glow:'rgba(255,159,28,.18)', font:F('Noto Sans KR'), titleFont:'Noto Sans KR' },
  ruin:    { bg:'#0a0203', accent:'#ff3b3b', accent2:'#8b0000', accent3:'#ff9a9a', text:'#ffe0e0', grid:'rgba(255,60,60,.06)', step:40, overlay:'rgba(60,0,0,.35)', font:F('Noto Sans KR'), titleFont:'Song Myung' },
  diary:   { bg:'#fff0f5', accent:'#ff8fb1', accent2:'#fde047', accent3:'#a78bfa', text:'#333333', grid:'rgba(255,182,193,.5)', step:30, font:F('Single Day'), titleFont:'Single Day' },
  pastel:  { bg:'#e8e4ff', accent:'#7c83e8', accent2:'#ff8fc7', accent3:'#7fd6e8', text:'#2b2d5b', grid:'rgba(124,131,232,.14)', step:30, font:F('Jua'), titleFont:'Jua' },
  ink:     { bg:'#ecebe6', accent:'#9b1c1c', accent2:'#2b2b2b', accent3:'#8d8d86', text:'#16130f', grid:null, font:F('Nanum Myeongjo'), titleFont:'Nanum Brush Script' },
  joseon:  { bg:'#efe3ca', accent:'#b3402a', accent2:'#2f7a73', accent3:'#d4a63c', text:'#2b2118', grid:'rgba(120,90,50,.07)', step:30, font:F('Gowun Batang'), titleFont:'Gowun Batang' },
  gyeongseong: { bg:'#12202b', accent:'#e0b44c', accent2:'#c4512f', accent3:'#4a8f8a', text:'#f3e9d2', grid:null, glow:'rgba(224,180,76,.12)', font:F('Hahmlet'), titleFont:'Do Hyeon' },
  modern:  { bg:'#e8dfcc', accent:'#b5472f', accent2:'#1f3d3a', accent3:'#c9a45a', text:'#1c2b2a', grid:null, font:F('Hahmlet'), titleFont:'Hahmlet' },
  hanji:   { bg:'#f1ece0', accent:'#3b3a36', accent2:'#a3281f', accent3:'#b9b2a0', text:'#1b1a17', grid:null, font:F('Gowun Batang'), titleFont:'Nanum Myeongjo' },
  wuxia:   { bg:'#0b0906', accent:'#d4af37', accent2:'#8b0000', accent3:'#f5e9c8', text:'#f5e9c8', grid:'rgba(212,175,55,.06)', step:40, overlay:'rgba(5,0,10,.35)', font:F('Nanum Myeongjo'), titleFont:'Yeon Sung' }
};
const THEME_PRIORITY = ['cam', 'cyber', 'wuxia', 'ruin', 'diary', 'pastel']; // 앞에 있을수록 우선

// =====================================================
// 2. 태그 → 위젯 연결표  (여기만 고치면 태그 동작이 바뀜!)
//    [id, 화면에 보일 이름, 켜지는 위젯들, 테마]
// =====================================================
const THEME_LABELS = { default:'기본', cyber:'사이버', cam:'디카', ruin:'피폐', diary:'다꾸', pastel:'파스텔', wuxia:'무협(금)', ink:'수묵', joseon:'조선', gyeongseong:'경성', modern:'경성 모던', hanji:'여백(한지)' };

// =====================================================
// 2. 위젯 분류 (버튼 목록 순서) — 위젯 이름으로 바로 고르기
// =====================================================
const WIDGET_GROUPS = [
  ['세션카드 기본', ['title','rule','credits','quote']],
  ['사이버 HUD', ['nameL','nameR','terminal','barcode','sysWarn','stripeFrame','warnBox','loading']],
  ['디카 HUD', ['camFrame','focusBox','subtitlePill','chatWin','musicPlayer','toast']],
  ['사진 · 다이어리 · 다꾸', ['photo','polaroid','tape1','tape2','sparkle','filmStrip','hashtags']],
  ['페어틀 · 카드', ['popWindow','playlist','vinyl','ticket','idCard']],
  ['TRPG · 게임', ['hpBar','dice','dday','seal','speech']],
  ['동양풍 · 무협 · 조선 · 경성', ['wuxiaFrame','wuxiaText','plaque','scroll','vertTitle','lantern','cloud']]
];

// =====================================================
// 3. 위젯 정의 — 각 위젯은 "자기 왼쪽 위 모서리가 (0,0)" 기준으로 그림
//    fields = [상세 설정 탭에 생기는 입력칸들]
// =====================================================
const DEFS = {
  // ---------- 공통 ----------
  title: { label:'시나리오 제목', icon:'🔤', base:true, x:40, y:84, w:400, h:80, fields:[],
    draw(c, it, P) {
      c.textBaseline = 'top'; c.textAlign = 'left';
      let size = 64; const fam = `"${state.tf}", "Noto Sans KR", sans-serif`;
      for (; size > 20; size -= 2) { c.font = `bold ${size}px ${fam}`; if (c.measureText(state.title).width <= 900) break; }
      it.w = Math.max(40, c.measureText(state.title).width); it.h = size * 1.25;
      if (P.light) { c.shadowColor = 'rgba(0,0,0,.12)'; c.shadowBlur = 4; c.shadowOffsetY = 2; } else { c.shadowColor = 'rgba(0,0,0,.8)'; c.shadowBlur = 10; c.shadowOffsetX = 3; c.shadowOffsetY = 3; }

// =====================================================
// 5. 그리기
// =====================================================
function bgSrc(prog) {

    }
  }
}

// =====================================================
// 6. 드래그 (손가락/마우스) + 가운데 자석
// =====================================================
function coords(e) {
  const r = canvas.getBoundingClientRect();

}
const HANDLE_HIT = 38;
let dragMode = null, g0 = null, lastTap = null, movedFar = false, quickTarget = null;
const imageField = id => (DEFS[id].fields || []).find(f => f.t === 'image');
function openPicker(id) { const f = imageField(id); if (!f) return; quickTarget = { id, k: f.k }; document.getElementById('quickPick').click(); }
document.getElementById('quickPick').addEventListener('change', e => {
  const fl = e.target.files[0]; e.target.value = ''; if (!fl || !quickTarget) return;
  const { id, k } = quickTarget; loadImg(fl, img => { W[id].imgs[k] = img; buildDetailCards(); status('사진을 넣었어요!'); });
});
function geo(it) { const sw = it.w * it.s, sh = it.h * it.s; return { sw, sh, a: (it.ang || 0) * Math.PI / 180, cx: it.x + sw / 2, cy: it.y + sh / 2 }; }

const status = t => { $('statusMsg').textContent = t; };

function startTL(mode, pos, e) {
  const g = tlGeo();
  dragging = '__tl'; dragMode = mode; movedFar = false;
  g0 = { cx: g.cx, cy: g.cy, s: state.tl.s, dist: Math.hypot(pos.x - g.cx, pos.y - g.cy) || 1, sx: pos.x, sy: pos.y, tx: state.tl.x, ty: state.tl.y };

  dragging = id; dragMode = mode; it.center = false;
  g0 = { cx: g.cx, cy: g.cy, s: it.s, dist: Math.hypot(pos.x - g.cx, pos.y - g.cy) || 1, sx: pos.x, sy: pos.y }; movedFar = false;

  }

    const g = geo(W[selected]), rh = rotPt(g, 0, -g.sh / 2 - 34), sh = rotPt(g, g.sw / 2 + 3, g.sh / 2 + 3);

canvas.addEventListener('pointermove', e => {

    it.s = s; it.x = Math.round(g0.cx - it.w * s / 2); it.y = Math.round(g0.cy - it.h * s / 2);   // 가운데 고정
  } else if (dragMode === 'rotate') {
    let a = Math.atan2(pos.y - g0.cy, pos.x - g0.cx) * 180 / Math.PI + 90;
    a = ((a + 540) % 360) - 180;
    const snap = Math.round(a / 45) * 45; if (Math.abs(a - snap) < 4) a = snap;
    it.ang = Math.round(a);
  }
  e.preventDefault();
});
const endDrag = () => {
  const was = dragMode, tid = dragging;
  if (was === 'tlmove' && !movedFar && tlWasSelected) { selected = null; markCard(null); status('위젯을 눌러 선택하세요'); }
  if (was && was.startsWith('tl')) { dragging = null; dragMode = null; lastTap = null; if (was !== 'tlmove' || movedFar) buildDetailCards(); return; }
  if (was === 'move' && !movedFar && tid && imageField(tid)) {
    const now = performance.now();
    if (lastTap && lastTap.id === tid && now - lastTap.t < 450) { lastTap = null; openPicker(tid); }
    else lastTap = { id: tid, t: now };
  } else lastTap = null;
  dragging = null; dragMode = null; guideV = guideH = false;
  if (was === 'scale' || was === 'rotate') buildDetailCards();   // 상세 설정 슬라이더 값 맞추기
};
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);

// =====================================================
// 7. 화면(UI) 만들기
// =====================================================
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
    else if (k === 'value') n.value = v; else n.setAttribute(k, v);
  }
  kids.flat().forEach(x => n.append(x)); return n;
}
const $ = id => document.getElementById(id);

// --- [위젯] 탭: 36종을 이름으로 바로 고르기
function buildWidgetTab() {
  const q = ($('wSearch').value || '').trim().toLowerCase();
  const box = $('widgetList'); box.innerHTML = '';
  WIDGET_GROUPS.forEach(([name, ids]) => {
    const list = ids.filter(id => !q || (DEFS[id].label + ' ' + name).toLowerCase().includes(q));
    if (!list.length) return;
    box.append(el('div', { class: 'tag-category', text: name }));
    const chips = el('div', { class: 'chips' });
    list.forEach(id => {
      const b = el('button', { class: 'wbtn' + (state.visible.has(id) ? ' active' : ''), text: `${DEFS[id].icon} ${DEFS[id].label}` });
      b.addEventListener('click', () => {
        if (state.visible.has(id)) { state.visible.delete(id); if (selected === id) selected = null; }
        else { state.visible.add(id); renderOrder = renderOrder.filter(k => k !== id); renderOrder.push(id); warmFonts(); }
        buildWidgetTab(); buildDetailCards();
      });
      chips.append(b);
    });
    box.append(chips);
  });
  if (!box.children.length) box.append(el('div', { class: 'blank', text: '찾는 위젯이 없어요 😢' }));
}
$('wSearch').addEventListener('input', buildWidgetTab);
$('btnAllOff').addEventListener('click', () => { state.visible.clear(); selected = null; buildWidgetTab(); buildDetailCards(); });


// --- [템플릿] 탭
function resetLayout() {
  for (const [id, d] of Object.entries(DEFS)) Object.assign(W[id], { x: d.x, y: d.y, s: 1, ang: 0, center: false });
  renderOrder = Object.keys(DEFS); state.tl = { x: 0, y: 0, s: 1, ang: 0 };
}
function applyTemplate(key) {
  const T = TEMPLATES[key]; if (!T) return;
  state.template = key; state.theme = T.theme; state.colors = { ...T.colors }; state.backdrop = T.backdrop;
  state.visible = new Set(Object.keys(T.widgets)); selected = null;
  resetLayout();
  for (const [id, o] of Object.entries(T.widgets)) {
    const { v, ...pos } = o; Object.assign(W[id], pos); if (v) Object.assign(W[id].v, v);
    renderOrder = renderOrder.filter(k => k !== id); renderOrder.push(id);
  }
  buildTemplateTab(); buildWidgetTab(); buildDetailCards(); buildThemeChips(); refreshColorInputs(); warmFonts();
  $('statusMsg').textContent = `템플릿 적용: ${T.name}`;
}
function buildTemplateTab() {
  const box = $('templateList'); box.innerHTML = '';
  ['세션카드', '페어틀', '동양풍'].forEach(g => {
    box.append(el('div', { class: 'tag-category', text: g + ' 템플릿' }));
    Object.entries(TEMPLATES).filter(([, T]) => T.group === g).forEach(([key, T]) => {
      const b = el('button', { class: 'tpl' + (state.template === key ? ' active' : '') }, el('b', { text: T.name }), el('small', { text: T.desc }));
      b.addEventListener('click', () => applyTemplate(key));
      box.append(b);
    });
  });
}
$('btnNoBackdrop').addEventListener('click', () => { state.backdrop = null; state.template = null; buildTemplateTab(); buildDetailCards(); });
$('btnTlReset').addEventListener('click', () => { state.tl = { x: 0, y: 0, s: 1, ang: 0 }; buildDetailCards(); });

// --- [색상] 탭: 분위기 버튼
function buildThemeChips() {
  const box = $('themeChips'); box.innerHTML = '';
  Object.entries(THEME_LABELS).forEach(([k, label]) => {
    const b = el('button', { class: 'wbtn' + (state.theme === k ? ' active' : ''), text: label });
    b.addEventListener('click', () => { state.theme = k; state.colors = {}; state.template = null; buildTemplateTab(); refreshColorInputs(); buildThemeChips(); warmFonts(); });
    box.append(b);
  });
}

// --- [상세 설정] 탭의 위젯별 입력칸
function loadImg(file, cb) { const img = new Image(); img.onload = () => cb(img); img.src = URL.createObjectURL(file); }
function fieldInput(it, f) {
  if (f.t === 'image') {
    const st = el('span', { class: 'rv', text: it.imgs[f.k] ? '넣음 ✓' : '없음' });
    const file = el('input', { type: 'file', accept: 'image/*', hidden: '' });
    file.addEventListener('change', () => { const fl = file.files[0]; if (fl) loadImg(fl, img => { it.imgs[f.k] = img; st.textContent = '넣음 ✓'; }); });
    const pick = el('button', { class: 'btn', type: 'button', text: '🖼️ 사진 고르기' }); pick.addEventListener('click', () => file.click());
    const clr = el('button', { class: 'btn', type: 'button', text: '지우기' }); clr.addEventListener('click', () => { delete it.imgs[f.k]; st.textContent = '없음'; });
    return el('div', { class: 'fld' }, el('span', { class: 'fl' }, f.l, st), el('div', { class: 'grid2', style: 'margin-top:4px' }, pick, clr), file);
  }
  if (f.t === 'range') {
    const out = el('span', { class: 'rv', text: it.v[f.k] });
    const inp = el('input', { type: 'range', min: f.min, max: f.max, value: it.v[f.k] });
    inp.addEventListener('input', () => { it.v[f.k] = Number(inp.value); out.textContent = inp.value; });
    return el('label', { class: 'fld' }, el('span', { class: 'fl' }, f.l, out), inp);
  }
  const inp = f.t === 'area' ? el('textarea', { class: 'input-box', rows: 3 }) : el('input', { type: 'text', class: 'input-box' });
  inp.value = it.v[f.k];
  inp.addEventListener('input', () => { it.v[f.k] = inp.value; warmFontsSoon(); });
  return el('label', { class: 'fld' }, el('span', { class: 'fl', text: f.l }), inp);
}
function sliderRow(label, min, max, val, unit, onInput) {
  const out = el('span', { class: 'rv', text: val + unit }), sl = el('input', { type: 'range', min, max, value: val });
  sl.addEventListener('input', () => { onInput(Number(sl.value)); out.textContent = sl.value + unit; });
  return el('label', { class: 'fld' }, el('span', { class: 'fl' }, label, out), sl);
}
function buildDetailCards() {
  const box = $('widgetCards'); box.innerHTML = '';
  if (hasLayer()) {
    const tl = state.tl, card = el('div', { class: 'card' + (selected === '__tl' ? ' sel' : ''), 'data-w': '__tl' }, el('h3', { text: '🎴 템플릿 틀 (배경틀·고정 틀 전체)' }));
    card.append(sliderRow('크기', 30, 300, Math.round(tl.s * 100), '%', v => { tl.s = v / 100; }));
    card.append(sliderRow('회전', -180, 180, Math.round(tl.ang), '°', v => { tl.ang = v; }));
    card.append(sliderRow('가로 위치', -480, 480, Math.round(tl.x), '', v => { tl.x = v; }));
    card.append(sliderRow('세로 위치', -270, 270, Math.round(tl.y), '', v => { tl.y = v; }));
    card.addEventListener('click', () => { selected = '__tl'; markCard('__tl'); });
    box.append(card);
  }
  const vis = visibleSet();
  availableIds().filter(id => vis.has(id) && !(DEFS[id].fixed && !DEFS[id].fields.length)).forEach(id => {
    const d = DEFS[id], it = W[id];
    const card = el('div', { class: 'card' + (selected === id ? ' sel' : ''), 'data-w': id }, el('h3', { text: `${d.icon} ${d.label}` }));
    (d.fields || []).forEach(f => card.append(fieldInput(it, f)));
    if (!d.fixed) {
      const out = el('span', { class: 'rv', text: Math.round(it.s * 100) + '%' });
      const sl = el('input', { type: 'range', min: 40, max: 250, value: Math.round(it.s * 100) });
      sl.addEventListener('input', () => { it.s = Number(sl.value) / 100; it.center = false; out.textContent = sl.value + '%'; });
      card.append(el('label', { class: 'fld' }, el('span', { class: 'fl' }, '크기', out), sl));
      const out2 = el('span', { class: 'rv', text: Math.round(it.ang || 0) + '°' });
      const sl2 = el('input', { type: 'range', min: -180, max: 180, value: Math.round(it.ang || 0) });
      sl2.addEventListener('input', () => { it.ang = Number(sl2.value); out2.textContent = sl2.value + '°'; });
      card.append(el('label', { class: 'fld' }, el('span', { class: 'fl' }, '회전', out2), sl2));
    }
    card.addEventListener('click', () => { selected = id; markCard(id); });
    box.append(card);
  });
}
function markCard(id) {
  document.querySelectorAll('#widgetCards .card').forEach(c => c.classList.toggle('sel', c.dataset.w === id));
}

// --- [색상] 탭
const COLOR_INPUTS = { colAccent: 'accent', colAccent2: 'accent2', colAccent3: 'accent3', colText: 'text', colBg: 'bg' };
function refreshColorInputs() {
  const P = palette();
  for (const [id, k] of Object.entries(COLOR_INPUTS)) $(id).value = P[k];
}
for (const [id, k] of Object.entries(COLOR_INPUTS)) $(id).addEventListener('input', e => { state.colors[k] = e.target.value; });
$('valDim').addEventListener('input', e => { state.dim = e.target.value / 100; $('dimVal').textContent = e.target.value + '%'; });
$('btnResetColor').addEventListener('click', () => { state.colors = {}; refreshColorInputs(); });

// --- 탭 전환
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('hidden', p.id !== t.dataset.tab));
}));

// --- 기본 정보 입력칸
[['valTitle', 'title'], ['valNameA', 'nameA'], ['valNameB', 'nameB'], ['valQuote', 'quote']].forEach(([id, key]) => {
  $(id).value = state[key];
  $(id).addEventListener('input', e => { state[key] = e.target.value; warmFontsSoon(); });
});
$('valTitleFont').addEventListener('change', e => { state.titleFont = e.target.value; warmFonts(); });
$('btnReset').addEventListener('click', () => { resetLayout(); buildDetailCards(); });

// =====================================================
// 8. 배경 이미지 / GIF
// =====================================================
$('btnClearBg').addEventListener('click', () => { state.bgMedia = null; $('statusMsg').textContent = '배경을 지웠어요'; });
$('bgInput').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  $('statusMsg').textContent = '미디어 분석 중...';
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    if (bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46) {
      const Reader = (window.omggif && window.omggif.GifReader) || window.GifReader;
      const reader = new Reader(bytes), n = reader.numFrames();
      if (n > 1) {
        const w = reader.width, h = reader.height, frames = [], px = new Uint8ClampedArray(w * h * 4);
        for (let i = 0; i < n; i++) {
          reader.decodeAndBlitFrameRGBA(i, px);
          const fc = document.createElement('canvas'); fc.width = w; fc.height = h;
          const fx = fc.getContext('2d'), id = fx.createImageData(w, h); id.data.set(px); fx.putImageData(id, 0, 0); frames.push(fc);
        }
        state.bgMedia = { isGif: true, frames, width: w, height: h };
        $('statusMsg').textContent = 'GIF 배경 적용 완료!'; return;
      }
    }
  } catch (err) { /* GIF가 아니면 아래 일반 이미지로 처리 */ }
  const img = new Image();
  img.onload = () => { state.bgMedia = { isGif: false, img, width: img.width, height: img.height }; $('statusMsg').textContent = '이미지 배경 적용 완료!'; };
  img.src = URL.createObjectURL(file);
});

// =====================================================
// 9. 폰트 미리 불러오기 (한글 글자 깨짐 방지)
// =====================================================
let warmTimer = null;
function warmFontsSoon() { clearTimeout(warmTimer); warmTimer = setTimeout(warmFonts, 300); }
function warmFonts() {
  const P = palette();
  const text = [state.title, state.nameA, state.nameB, state.quote, '가나다라마바사아자차카타파하ABCabc0123456789',
    ...Object.values(W).flatMap(it => Object.values(it.v).map(String))].join('');
  const fams = new Set([state.titleFont === 'auto' ? P.titleFont : state.titleFont, 'Noto Sans KR', 'Share Tech Mono', 'Nanum Pen Script', 'Gowun Batang', 'Nanum Myeongjo']);
  const first = /"([^"]+)"/.exec(P.font); if (first) fams.add(first[1]);
  fams.forEach(f => document.fonts.load(`16px "${f}"`, text).catch(() => {}));
  document.fonts.load(`bold 16px "Noto Sans KR"`, text).catch(() => {});
}

// =====================================================
// 10. 저장 (영상 / GIF / PNG)
// =====================================================
const bar = $('loadingBar'), fill = $('progressFill'), resultArea = $('resultArea');
function download(url, name) { const a = document.createElement('a'); a.href = url; a.download = name; a.click(); }
function startExport() { isExporting = true; bar.classList.remove('hidden'); resultArea.classList.add('hidden'); fill.style.width = '0'; }
function endExport(msg) { isExporting = false; bar.classList.add('hidden'); resultArea.textContent = msg; resultArea.classList.remove('hidden'); }

$('btnExportPNG').addEventListener('click', () => {
  const was = isExporting; isExporting = true; draw(animProgress);
  canvas.toBlob(b => { download(URL.createObjectURL(b), `SECARD_${Date.now()}.png`); isExporting = was; });
});

$('btnExportMP4').addEventListener('click', () => {
  if (isExporting) return;
  startExport(); draw(0);
  const stream = canvas.captureStream(30);
  let mime = 'video/mp4';
  if (!MediaRecorder.isTypeSupported(mime)) mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  let rec; try { rec = new MediaRecorder(stream, { mimeType: mime }); } catch (e) { rec = new MediaRecorder(stream); }
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  rec.onstop = () => {
    const type = rec.mimeType || mime, ext = type.includes('mp4') ? 'mp4' : 'webm';
    download(URL.createObjectURL(new Blob(chunks, { type })), `SECARD_${Date.now()}.${ext}`);
    endExport(ext === 'mp4' ? '저장 완료!' : '저장 완료! (이 브라우저는 webm 영상으로 저장돼요)');
  };
  rec.start();
  let f = 0; const total = 180;
  const timer = setInterval(() => {
    draw(f / total); f++; fill.style.width = `${Math.min(100, f / total * 100)}%`;
    if (f >= total) { clearInterval(timer); rec.stop(); }
  }, 33);
});

$('btnExportGIF').addEventListener('click', () => {
  if (isExporting) return;
  if (!window.gifshot) { alert('GIF 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 해주세요.'); return; }
  startExport();
  const frames = [], n = 20;
  for (let i = 0; i < n; i++) { draw(i / n); frames.push(canvas.toDataURL('image/png')); }
  fill.style.width = '50%';
  gifshot.createGIF({ images: frames, gifWidth: 960, gifHeight: 540, interval: .25, numWorkers: 2 }, obj => {
    if (obj.error) { endExport('GIF 만들기에 실패했어요 😢'); return; }
    download(obj.image, `SECARD_${Date.now()}.gif`); endExport('저장 완료!');
  });
});

// =====================================================
// 11. 시작!
// =====================================================
applyTemplate('sessionClassic');
setInterval(() => { if (!isExporting) { animProgress = (animProgress + .007) % 1; draw(animProgress); } }, 33);
</script>
</body>
